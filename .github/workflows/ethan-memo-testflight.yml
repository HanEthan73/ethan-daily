# ETHAN MEMO → TestFlight 자동 배포 (PC 없이 아이폰 설치·자동 업데이트)
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID       App Store Connect API 키 ID
#   ASC_ISSUER_ID    Issuer ID
#   ASC_KEY_P8       .p8 파일 내용 전체(-----BEGIN PRIVATE KEY----- 포함)
#   APPLE_TEAM_ID    개발자 팀 ID (10자리)
# Secrets가 없으면 이 워크플로는 아무것도 하지 않고 끝납니다.
name: ethan-memo-testflight

on:
  push:
    paths: ['ethan-memo/ios/**', '.github/workflows/ethan-memo-testflight.yml']
  workflow_dispatch:

concurrency:
  group: ethan-memo-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    defaults:
      run:
        working-directory: ethan-memo/ios
    steps:
      - name: Check secrets
        id: chk
        working-directory: .
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "TestFlight secrets not set yet - skipping."; echo "ok=0" >> $GITHUB_OUTPUT
          else echo "ok=1" >> $GITHUB_OUTPUT; fi

      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == '1'

      - name: Prepare
        if: steps.chk.outputs.ok == '1'
        run: |
          brew install xcodegen
          xcodegen generate
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict></plist>
          PLIST

      - name: Archive (signed)
        if: steps.chk.outputs.ok == '1'
        run: |
          set -o pipefail
          N=$(( ${{ github.run_number }} + 100 ))
          echo "N=$N" >> $GITHUB_ENV
          xcodebuild archive -project Haru.xcodeproj -scheme Haru -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Haru.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="1.1.$N" CURRENT_PROJECT_VERSION="$N" \
            2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Upload to TestFlight
        if: steps.chk.outputs.ok == '1'
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/Haru.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | grep -E "error|Upload|EXPORT (SUCCEEDED|FAILED)" || true
          grep -q "EXPORT SUCCEEDED" export.log

      - name: Logs
        if: always() && steps.chk.outputs.ok == '1'
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ethan-memo/ios/archive.log
            ethan-memo/ios/export.log
