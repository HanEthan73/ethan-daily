name: fetch-photos
on:
  push:
    paths: ['toeic/photos/list.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search Wikimedia Commons and download
        run: |
          set +e
          UA="ethan-daily-toeic/1.0 (https://github.com/HanEthan73/ethan-daily)"
          mkdir -p toeic/photos/cand
          echo "[]" > toeic/photos/cand/meta.json
          n=0
          while read -r q; do
            [ -z "$q" ] && continue
            n=$((n+1))
            curl -sS -A "$UA" -G "https://commons.wikimedia.org/w/api.php" \
              --data-urlencode "action=query" --data-urlencode "format=json" --data-urlencode "generator=search" \
              --data-urlencode "gsrnamespace=6" --data-urlencode "gsrsearch=$q filetype:bitmap" --data-urlencode "gsrlimit=8" \
              --data-urlencode "prop=imageinfo" --data-urlencode "iiprop=url|extmetadata|size" --data-urlencode "iiurlwidth=1280" > r.json
            jq -c '.query.pages // {} | to_entries[] | .value | {title, w:.imageinfo[0].width, h:.imageinfo[0].height, thumb:.imageinfo[0].thumburl, page:.imageinfo[0].descriptionurl, lic:.imageinfo[0].extmetadata.LicenseShortName.value, artist:.imageinfo[0].extmetadata.Artist.value, desc:.imageinfo[0].extmetadata.ImageDescription.value}' r.json > items.jsonl
            i=0
            while read -r it; do
              w=$(echo "$it" | jq -r .w); h=$(echo "$it" | jq -r .h); t=$(echo "$it" | jq -r .thumb)
              [ "$w" -lt 1000 ] 2>/dev/null && continue
              [ "$h" -gt "$w" ] 2>/dev/null && continue
              i=$((i+1)); f="toeic/photos/cand/q${n}_$i.jpg"
              curl -sSL -A "$UA" -o "$f.tmp" "$t"
              if file "$f.tmp" | grep -qi image; then
                convert "$f.tmp" -auto-orient -resize '1280x1280>' -strip -quality 80 "$f"
                jq --argjson it "$it" --arg f "$(basename "$f")" --arg q "$q" '. + [$it + {file:$f, q:$q}]' toeic/photos/cand/meta.json > m.tmp && mv m.tmp toeic/photos/cand/meta.json
                echo "ok $f $(du -h "$f" | cut -f1)"
              else echo "fail $t"; fi
              rm -f "$f.tmp"
              [ $i -ge 5 ] && break
            done < items.jsonl
          done < toeic/photos/list.txt
          rm -f r.json items.jsonl
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add toeic/photos/cand
          git commit -m "Fetch candidate TOEIC photos (Wikimedia Commons)" && git push || echo "nothing to commit"
