# ETHAN MEMO iOS 앱을 GitHub의 클라우드 Mac에서 빌드해 .ipa로 만듭니다 (Mac 없이).
# 결과: Actions → 이 실행 → Artifacts → ETHAN-MEMO-ipa
# 설치: PC의 Sideloadly에서 Apple ID로 서명해 아이폰에 설치
name: ethan-memo-ios

permissions:
  contents: write

concurrency:
  group: ethan-memo-ios
  cancel-in-progress: false

on:
  push:
    paths: ['ethan-memo/ios/**', '.github/workflows/ethan-memo-ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ethan-memo/ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project Haru.xcodeproj -target Haru \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*Swift|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Haru.app Payload/
          zip -qry ETHAN-MEMO.ipa Payload
          ls -lh ETHAN-MEMO.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ETHAN-MEMO-ipa
          path: ethan-memo/ios/ETHAN-MEMO.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ethan-memo/ios/build.log

      # SideStore/AltStore가 읽는 앱 소스: Pages에 ipa + source.json을 올리면 아이폰에서 업데이트로 보임
      - name: Publish to Pages (ipa + SideStore source)
        run: |
          N=${{ github.run_number }}
          V="1.0.$N"
          DIST=../dist
          mkdir -p $DIST
          cp ETHAN-MEMO.ipa $DIST/ETHAN-MEMO.ipa
          SIZE=$(stat -f%z $DIST/ETHAN-MEMO.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          MSG=$(git log -1 --pretty=%s | head -c 200 | sed 's/"/\\"/g')
          BASE="https://hanethan73.github.io/ethan-daily/ethan-memo"
          cat > $DIST/source.json <<JSON
          {
            "name": "ETHAN MEMO",
            "identifier": "io.github.hanethan73.ethanmemo",
            "subtitle": "개인용 메모 · 할 일 · 캘린더",
            "iconURL": "$BASE/icon-512.png",
            "tintColor": "#2A50C8",
            "apps": [
              {
                "name": "ETHAN MEMO",
                "bundleIdentifier": "com.ethanhan.haru",
                "developerName": "Ethan",
                "subtitle": "날짜별 메모 · 할 일 · 캘린더 · 위젯",
                "localizedDescription": "날짜별 메모, 완료 체크되는 할 일, 드래그로 기간 일정 등록, 홈 화면 위젯, 메모를 바로 Claude에게.",
                "iconURL": "$BASE/icon-512.png",
                "tintColor": "#2A50C8",
                "category": "productivity",
                "versions": [
                  {
                    "version": "$V",
                    "buildVersion": "$N",
                    "date": "$DATE",
                    "localizedDescription": "$MSG",
                    "downloadURL": "$BASE/dist/ETHAN-MEMO.ipa?v=$N",
                    "size": $SIZE,
                    "minOSVersion": "17.0"
                  }
                ],
                "appPermissions": { "entitlements": [], "privacy": {} }
              }
            ],
            "news": []
          }
          JSON
          sed -i '' 's/^          //' $DIST/source.json
          python3 -m json.tool $DIST/source.json > /dev/null
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add ethan-memo/dist
          git commit -m "ETHAN MEMO iOS build $V" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
