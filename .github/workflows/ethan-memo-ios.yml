# ETHAN MEMO iOS 앱을 GitHub의 클라우드 Mac에서 빌드해 .ipa로 만듭니다 (Mac 없이).
# 결과: Actions → 이 실행 → Artifacts → ETHAN-MEMO-ipa
# 설치: PC의 Sideloadly에서 Apple ID로 서명해 아이폰에 설치
name: ethan-memo-ios

on:
  push:
    paths: ['ethan-memo/ios/**', '.github/workflows/ethan-memo-ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ethan-memo/ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project Haru.xcodeproj -target Haru \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*Swift|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Haru.app Payload/
          zip -qry ETHAN-MEMO.ipa Payload
          ls -lh ETHAN-MEMO.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ETHAN-MEMO-ipa
          path: ethan-memo/ios/ETHAN-MEMO.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ethan-memo/ios/build.log
