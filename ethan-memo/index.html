<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ETHAN MEMO</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ETHAN MEMO">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1219" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 데스크톱 = 왼쪽 월간 캘린더 / 오른쪽 선택한 날의 기록. 모바일 = 위아래로 쌓고, 탭으로 할 일 모아보기 */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#EBEFF5; --ink:#141C28; --muted:#647083; --line:#DFE4EC;
  --accent:#2A50C8; --accent-ink:#FFFFFF; --event:#2A50C8; --todo:#0E8468; --memo:#B4761A;
  --sun:#D23F3F; --sat:#2C68D6; --warn:#C2410C; --warn-soft:#FDEEE6;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1219; --surface:#151C26; --sunk:#1B2330; --ink:#E5EAF2; --muted:#8C97A8; --line:#253041;
  --accent:#7395FF; --accent-ink:#0D1219; --event:#7395FF; --todo:#3CC49F; --memo:#E2A94B;
  --sun:#FF7B7B; --sat:#7EA8FF; --warn:#FF8F5E; --warn-soft:#2E1C15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1219; --surface:#151C26; --sunk:#1B2330; --ink:#E5EAF2; --muted:#8C97A8; --line:#253041;
  --accent:#7395FF; --accent-ink:#0D1219; --event:#7395FF; --todo:#3CC49F; --memo:#E2A94B;
  --sun:#FF7B7B; --sat:#7EA8FF; --warn:#FF8F5E; --warn-soft:#2E1C15; color-scheme:dark}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:auto}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
.mark{width:22px;height:22px;border-radius:6px;background:var(--ink);position:relative;flex:none}
.mark::after{content:"";position:absolute;left:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--bg)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="db"]::before{background:var(--todo)}
.sync[data-s="local"]::before{background:var(--memo)}
.tabs{display:flex;background:var(--sunk);border-radius:999px;padding:3px}
.tabs button{padding:6px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(10,20,40,.12)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;font-weight:600;display:inline-grid;place-items:center}
.badge:empty{display:none}

.grid{display:grid;gap:16px;align-items:start}
@media (min-width:860px){.grid{grid-template-columns:minmax(330px,400px) minmax(0,1fr)}.cal-col{position:sticky;top:16px}}
@media (max-width:859px){.app[data-view="todo"] .cal-col{display:none}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.cal{padding:14px 12px 12px}
.cal-head{display:flex;align-items:center;gap:4px;padding:0 4px 10px}
.cal-head h2{margin:0 auto 0 4px;font-size:17px;font-weight:600;letter-spacing:-.01em;order:-1}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:20px;color:var(--muted)}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.ghost{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:500}
.ghost:hover{background:var(--sunk)}
.wk,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wk span{text-align:center;font-size:12px;color:var(--muted);padding-bottom:6px}
.wk span:first-child{color:var(--sun)} .wk span:last-child{color:var(--sat)}
.days{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.day{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0 5px;border-radius:10px}
.day.rng,.day.rng:hover{background:color-mix(in srgb,var(--accent) 18%,transparent);border-radius:0}
.day.rng-l{border-top-left-radius:12px;border-bottom-left-radius:12px}
.day.rng-r{border-top-right-radius:12px;border-bottom-right-radius:12px}
.bar{position:absolute;height:12px;border-radius:4px;background:var(--event);color:var(--accent-ink);font-size:9.5px;font-weight:600;line-height:12px;padding:0 4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.open-l{border-top-left-radius:0;border-bottom-left-radius:0}
.bar.open-r{border-top-right-radius:0;border-bottom-right-radius:0}
.day:hover{background:var(--sunk)}
.day .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px}
.day.sun .n{color:var(--sun)} .day.sat .n{color:var(--sat)}
.day.out{opacity:.35}
.day.today .n{box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:500}
.day.sel .n{background:var(--accent);color:var(--accent-ink);box-shadow:none;font-weight:500}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
.d-event{background:var(--event)} .d-todo{background:var(--todo)} .d-memo{background:var(--memo)}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);padding-top:10px;border-top:1px solid var(--line);margin-top:6px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:7px;height:7px;border-radius:50%}

.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.day-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{margin:0;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.day-head h2{margin:2px 0 0;font-size:24px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;text-wrap:balance}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);letter-spacing:0}
.counts{margin:0;font-size:13px;color:var(--muted)}

.composer{padding:10px;display:flex;flex-direction:column;gap:8px}
.seg{display:flex;gap:4px}
.seg button{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px;border:1px solid transparent}
.seg button i{width:7px;height:7px;border-radius:50%}
.seg button[aria-pressed="true"]{border-color:var(--line);background:var(--sunk);color:var(--ink)}
.c-row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.c-row input[type=text]{flex:1 1 180px;min-width:0}
input[type=text],input[type=date],input[type=time],textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px}
input[type=time]{width:112px;font-family:var(--f-mono)}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
.primary{background:var(--accent);color:var(--accent-ink);padding:0 16px;border-radius:10px;font-weight:600;font-size:14px;min-height:40px}
.primary:hover{filter:brightness(1.08)}

.sec{padding:4px 0}
.sec-h{display:flex;align-items:center;gap:8px;padding:10px 14px 6px;font-size:13px;font-weight:600}
.sec-h i{width:8px;height:8px;border-radius:50%}
.sec-h .c{color:var(--muted);font-weight:400;font-family:var(--f-mono)}
.sec-h .sp{flex:1}
.link{font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.list{list-style:none;margin:0;padding:0}
.it{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it .body{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px;border-radius:6px}
.it .txt{overflow-wrap:anywhere;white-space:pre-wrap}
.it .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.time{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--event);min-width:44px;padding-top:1px}
.time.none{color:var(--muted)}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--todo);flex:none;margin-top:1px;display:grid;place-items:center}
.chk:hover{background:color-mix(in srgb,var(--todo) 14%,transparent)}
.chk svg{width:12px;height:12px;opacity:0}
.done .chk{background:var(--todo)} .done .chk svg{opacity:1}
.done .txt{text-decoration:line-through;color:var(--muted)}
.ex{font-size:11px;padding:0 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.late{color:var(--warn);font-weight:500}
.datechip{font-family:var(--f-mono);font-size:12px;padding:1px 7px;border-radius:6px;background:var(--sunk);color:var(--ink)}
.datechip:hover{background:var(--line)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}
.rel{font-size:12px;font-weight:500;color:var(--muted)}
.group-late .rel{color:var(--warn)}
.group-today .rel{color:var(--accent)}
.group-today .datechip{background:var(--accent);color:var(--accent-ink)}
.sec-h .datechip{font-size:13px;font-weight:500;padding:2px 9px}

.sheet-bg{position:fixed;inset:0;background:rgba(8,12,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0 max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
@media (min-width:600px){.sheet-bg{align-items:center}}
.sheet{width:100%;max-width:480px;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
@media (min-width:600px){.sheet{border-radius:18px;padding-bottom:18px}}
.sheet h3{margin:0;font-size:17px}
.sheet textarea{resize:vertical;min-height:96px;line-height:1.5}
.f-row{display:flex;gap:10px;flex-wrap:wrap}
.f-row label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.f-row input[type=date]{font-family:var(--f-mono)}
.donebox{display:flex;align-items:center;gap:8px;font-size:14px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actions .sp{flex:1}
.danger{color:var(--warn);font-size:14px;font-weight:500;padding:8px 4px}
.danger.armed{background:var(--warn-soft);padding:8px 12px;border-radius:10px}
.ask{font-size:12px;font-weight:500;color:var(--accent);display:inline-flex;align-items:center;gap:5px;padding:2px 0}
.ask::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.ask[disabled]{color:var(--muted);cursor:default}
.ans{margin-top:6px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.ans-h{font-size:11px;letter-spacing:.06em;color:var(--muted);margin-bottom:4px;display:flex;gap:8px;align-items:center}
.ans-h .sp{flex:1}
.c-row .ghost{border-radius:10px;white-space:nowrap}
.f-col{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:15px;color:var(--ink)}
input[type=password]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px;font-family:var(--f-mono)}
.hint{margin:-4px 0 0;font-size:12px;color:var(--muted)}
.set-msg{margin:0;padding:8px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.app[data-view="widget"] .top,.app[data-view="widget"] .cal-col{display:none}
.app[data-view="widget"] .grid{grid-template-columns:minmax(0,1fr);max-width:520px;margin:0 auto;width:100%}
.wg{border-radius:28px;padding:22px 20px 14px;display:flex;flex-direction:column;gap:6px}
.wg-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.wg-num{font-family:var(--f-mono);font-size:44px;font-weight:500;line-height:1;letter-spacing:-.03em}
.wg-sub{margin-top:6px;font-size:15px;font-weight:600;color:var(--todo)}
.wg-btn{width:46px;height:46px;border-radius:50%;background:var(--todo);color:var(--surface);display:grid;place-items:center;flex:none}
.wg .it{border-top:0;padding:9px 2px;align-items:center}
.wg .chk{width:26px;height:26px;border-color:var(--muted)}
.wg .txt{font-size:16px}
.wg-add{display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
.wg-add input{flex:1;min-width:0}
.wg-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:4px 2px 0}
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));text-align:center}
.lock h2{margin:0;font-size:22px;letter-spacing:-.02em}
.lock p{margin:0;color:var(--muted);font-size:14px}
.lock .mark{width:56px;height:56px;border-radius:14px}
.lock .mark::after{left:13px;top:13px;width:14px;height:14px}
.lock .primary{min-height:48px;padding:0 24px;font-size:16px}
.lockrow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:500}
.lockrow small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.wg-groups{display:flex;flex-direction:column;gap:4px}
.wg-date{display:flex;align-items:center;gap:8px;width:100%;padding:10px 2px 2px;font-size:13px;border-top:1px solid var(--line)}
.wg-day:first-child .wg-date{border-top:0;padding-top:4px}
.wg-date b{font-family:var(--f-mono);font-weight:500}
.wg-date span{color:var(--muted);font-size:12px}
.wg-date em{margin-left:auto;font-style:normal;color:var(--muted);font-family:var(--f-mono);font-size:12px}
.wg-day.now .wg-date b{color:var(--accent)}
.wg-day.past .wg-date span{color:var(--warn)}
.wg-day .meta .late{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:30;max-width:90%}
@media (prefers-reduced-motion:no-preference){.day,.chk,.tabs button{transition:background .15s,color .15s}}
</style>
</head>
<body>
<div class="lock" id="lock" hidden>
  <span class="mark" aria-hidden="true"></span>
  <h2>ETHAN MEMO</h2>
  <p id="lockMsg">잠겨 있습니다</p>
  <button class="primary" id="unlockBtn">Face ID로 열기</button>
</div>
<div class="app" id="app" data-view="todo">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><h1>ETHAN MEMO</h1></div>
    <span class="sync" id="sync" data-s="wait">불러오는 중</span>
    <nav class="tabs" role="tablist" aria-label="보기 전환">
      <button role="tab" id="tab-cal" aria-selected="false">캘린더</button>
      <button role="tab" id="tab-todo" aria-selected="true">할 일 <span class="badge" id="badge"></span></button>
    </nav>
    <button class="ghost" id="wgBtn">위젯 모드</button>
    <button class="icon-btn" id="setBtn" aria-label="설정"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>

  <main class="grid">
    <section class="cal-col" aria-label="달력">
      <div class="cal card">
        <div class="cal-head">
          <button class="icon-btn" id="prev" aria-label="이전 달">‹</button>
          <button class="icon-btn" id="next" aria-label="다음 달">›</button>
          <button class="ghost" id="todayBtn">오늘</button>
          <h2 id="monthLabel" class="mono">2026년 11월</h2>
        </div>
        <div class="wk" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
        <div class="days" id="days"></div>
        <div class="legend"><span><i class="d-event"></i>일정</span><span><i class="d-todo"></i>할 일</span><span><i class="d-memo"></i>메모</span><span>· 여러 날은 드래그</span></div>
      </div>
    </section>
    <section class="panel" id="panel"></section>
  </main>
</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">기록 수정</h3>
    <div class="seg" id="eType"></div>
    <textarea id="eText" rows="4" aria-label="내용"></textarea>
    <div class="f-row">
      <label><span id="eDateLbl">날짜</span><input type="date" id="eDate"></label>
      <label id="eEndWrap">종료<input type="date" id="eEnd"></label>
      <label id="eTimeWrap">시간<input type="time" id="eTime"></label>
    </div>
    <div class="hint" id="eSpan"></div>
    <div hidden>
    </div>
    <label class="donebox" id="eDoneWrap"><input type="checkbox" id="eDone"> 완료한 할 일</label>
    <div class="actions">

<script>
(function(){
const KD=['일','월','화','수','목','금','토'];
const TYPES={event:'일정',todo:'할 일',memo:'메모'};
const PH={memo:'메모를 남기세요',todo:'할 일을 입력하세요',event:'일정 제목 (예: 팀 회의)'};
const LS='haru.items.v1';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=id=>document.getElementById(id);
function h(tag,props,...kids){const el=document.createElement(tag);
  if(props)for(const k in props){const v=props[k];if(v==null||v===false)continue;
    if(k==='class')el.className=v;else if(k==='text')el.textContent=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?'':v);}
  for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(c));}
  return el;}
const CHECK='<svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2 5 8.6l4.6-5" stroke="var(--surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const S={items:new Map(),view:'todo',sel:today(),month:(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1)})(),
  type:'memo',mode:'wait',col:null,showDone:false,edit:null,sample:null,asking:new Map()};

/* ---------- Claude에게 묻기 ---------- */
function askPrompt(x){
  const kind={memo:'메모해 둔 궁금증이나 생각',todo:'할 일로 적어 둔 것',event:'일정으로 잡아 둔 것'}[x.type]||'메모';
  const extra={memo:'질문이 아니라 메모라면 그 주제에서 알면 좋을 핵심과, 이어서 생각해 볼 질문 1개를 주세요.',
    todo:'이 할 일을 끝내기 위한 구체적인 단계와 놓치기 쉬운 점을 알려 주세요.',
    event:'이 일정을 위해 미리 준비하거나 확인할 것을 알려 주세요.'}[x.type]||'';
  const when=x.endDate?`${x.date}~${x.endDate}`:x.date+(x.time?` ${x.time}`:'');
  return `다음은 사용자가 ${when}에 ${kind}입니다. 한국어로 답하세요.
- 첫 줄은 "한 줄 요약: "으로 시작하는 쉬운 한 문장.
- 이어서 핵심을 간결하게 (필요하면 "1." "2." 같은 짧은 번호 목록).
- 마크다운 기호(#, **, 표)는 쓰지 말고 일반 텍스트로. 600자 이내.
- ${extra}

내용:
${x.text}`;}
async function ask(id){
  const x=S.items.get(id);if(!x||!S.sample||S.asking.has(id))return;
  if(!lsGet(KEY_LS)){openSettings('Claude에게 물으려면 API 키를 먼저 넣어 주세요.');return;}
  S.asking.set(id,'');render();
  try{
    const r=await S.sample(askPrompt(x),{cache:false,onText:({text})=>{S.asking.set(id,text);const el=document.getElementById('ans-'+id);if(el)el.textContent=text||'생각하는 중…';}});
    S.asking.delete(id);
    const cur=S.items.get(id);if(cur)put({...cur,answer:r.text,answeredAt:Date.now()});else render();
  }catch(e){
    S.asking.delete(id);render();
    if(e&&e.code==='bad_key')openSettings('API 키가 올바르지 않습니다. 다시 확인해 주세요.');
    else if(e&&e.code==='rate_limited')toast('요청이 많습니다. 잠시 후 다시 물어보세요.');
    else toast('답변을 받지 못했습니다'+(e&&e.message?': '+e.message:'. 다시 시도해 주세요.'));
  }
}

/* ---------- storage ---------- */
function examples(){const t=new Date();const off=n=>{const d=new Date(t);d.setDate(d.getDate()+n);return ymd(d)};
  return [
    {type:'event',date:off(1),time:'10:00',text:'팀 주간 회의'},
    {type:'event',date:off(4),time:'15:30',text:'치과 예약'},
    {type:'todo',date:off(-1),time:'',text:'택배 반품 접수'},
    {type:'todo',date:off(0),time:'18:00',text:'장보기 목록 정리'},
    {type:'todo',date:off(0),time:'',text:'운동 30분',done:true,doneAt:Date.now()},
    {type:'memo',date:off(0),time:'',text:'날짜를 누르면 그날의 일정·할 일·메모가 한 번에 보입니다.\n할 일은 동그라미를 눌러 완료 처리하세요.'}
  ].map((x,i)=>({id:'ex'+i,done:false,createdAt:Date.now()-i*60000,example:true,...x}));}
function loadLocal(){let arr=null;try{arr=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
  if(!Array.isArray(arr))arr=[];S.items=new Map(arr.map(x=>[x.id,x]));}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify([...S.items.values()]))}catch(e){}}
const queue=new Map();
function enqueue(id,fn){const p=(queue.get(id)||Promise.resolve()).then(fn);queue.set(id,p.catch(()=>{}));return p;}
function errMsg(e){return e&&e.code==='quota_exceeded'?'저장 공간이 가득 찼습니다. 오래된 기록을 지워 주세요.':'저장하지 못했습니다. 잠시 후 다시 시도해 주세요.'}
function put(item){S.items.set(item.id,item);render();
  if(S.col){const{id,...body}=item;enqueue(id,()=>S.col.doc(id).set(body)).catch(e=>toast(errMsg(e)));}else saveLocal();}
function remove(id){S.items.delete(id);render();
  if(S.col)enqueue(id,()=>S.col.doc(id).delete()).catch(e=>toast(errMsg(e)));else saveLocal();}

/* ---------- Claude API (키는 이 기기 localStorage에만) ---------- */
const KEY_LS='ethanmemo.apikey',MODEL_LS='ethanmemo.model';
const MODELS=[['claude-sonnet-5-5','Sonnet 5.5 (기본)'],['claude-haiku-5-5','Haiku 5.5 (빠름·저렴)'],['claude-opus-5-5','Opus 5.5 (깊이)']];
function lsGet(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function lsSet(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}
async function callClaude(prompt,{onText}={}){
  const key=lsGet(KEY_LS);if(!key)throw {code:'no_key'};
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{
    'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json',
    'anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:lsGet(MODEL_LS)||MODELS[0][0],max_tokens:1200,stream:true,messages:[{role:'user',content:prompt}]})});
  if(!res.ok){let m='';try{m=(await res.json()).error.message}catch(e){}
    throw {code:res.status===401?'bad_key':res.status===429?'rate_limited':'http',message:m,status:res.status};}
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='',text='';
  for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
    let i;while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
      if(!line.startsWith('data:'))continue;let ev;try{ev=JSON.parse(line.slice(5))}catch(e){continue}
      if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'){text+=ev.delta.text;onText&&onText({text});}
      if(ev.type==='error')throw {code:'http',message:ev.error&&ev.error.message};}}
  return {text:text.trim()};
}
async function connect(){
  S.sample=(p,o)=>callClaude(p,o);
  toLocal();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
function toLocal(){S.mode='local';loadLocal();render();}
function setSync(s,t){const el=$('sync');el.dataset.s=s;el.textContent=t;}

/* ---------- derived ---------- */
const all=()=>[...S.items.values()];
const ofDate=d=>all().filter(x=>x.date===d||(x.endDate&&x.date<=d&&x.endDate>=d));
const byTime=(a,b)=>(a.time||'99').localeCompare(b.time||'99')||(a.createdAt||0)-(b.createdAt||0);
function fmtDay(s){const d=pd(s);return `${d.getMonth()+1}/${d.getDate()} (${KD[d.getDay()]})`;}
function clock(ms){return new Date(ms).toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'});}

/* ---------- render ---------- */
function render(){
  $('app').dataset.view=S.view;
  $('tab-cal').setAttribute('aria-selected',S.view==='cal');
  $('tab-todo').setAttribute('aria-selected',S.view==='todo');
  setSync(lsGet(KEY_LS)?'db':'local',lsGet(KEY_LS)?'Claude 연결됨':'이 기기에 저장');
  const t=today();
  const due=all().filter(x=>x.type==='todo'&&!x.done&&x.date<=t).length;
  $('badge').textContent=due?String(due):'';
  if(S.view==='widget'){renderWidget();return;}
  renderCal();
  S.view==='cal'?renderDay():renderTodos();
}

/* 위젯: 날짜별로 끊어서 (최신 날짜가 위) */
function widgetGroups(open,t){
  const g={};for(const x of open)(g[x.date]||(g[x.date]=[])).push(x);
  const box=h('div',{class:'wg-groups'});let shown=0;
  for(const d of Object.keys(g).sort().reverse()){
    if(shown>=12)break;
    const diff=dayDiff(t,d);
    const rel=diff===0?'오늘':diff===-1?'어제':diff===1?'내일':diff<0?`${-diff}일 지남`:`${diff}일 후`;
    const list=g[d].sort(byTime).slice(0,12-shown);shown+=list.length;
    box.append(h('div',{class:'wg-day'+(diff<0?' past':'')+(diff===0?' now':'')},
      h('button',{class:'wg-date',onclick:()=>{location.hash='';goDate(d);}},h('b',{text:fmtDay(d)}),h('span',{text:rel}),h('em',{text:String(g[d].length)})),
      h('ul',{class:'list'},list.map(x=>itemRow(x)))));
  }
  return box;
}
/* 위젯 모드: 미리 알림 위젯처럼 남은 할 일만 크게 */
function renderWidget(){
  const p=$('panel'),t=today();
  const prev=$('wText'),keep=prev?{v:prev.value,f:document.activeElement===prev}:null;
  const open=all().filter(x=>x.type==='todo'&&!x.done).sort((a,b)=>a.date.localeCompare(b.date)||byTime(a,b));
  const late=open.filter(x=>x.date<t).length,todayN=open.filter(x=>x.date===t).length;
  const inp=h('input',{type:'text',id:'wText',placeholder:'오늘 할 일 추가','aria-label':'할 일 추가',autocomplete:'off',enterkeyhint:'done'});
  const icon=h('button',{class:'wg-btn','aria-label':'전체 화면으로',onclick:()=>{location.hash='';S.view='todo';render();}});
  icon.innerHTML='<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="4" cy="5" r="1.4" fill="currentColor"/><circle cx="4" cy="10" r="1.4" fill="currentColor"/><circle cx="4" cy="15" r="1.4" fill="currentColor"/><path d="M8 5h9M8 10h9M8 15h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  const card=h('div',{class:'wg card'},
    h('div',{class:'wg-top'},h('div',null,h('div',{class:'wg-num',text:String(open.length)}),
      h('div',{class:'wg-sub',text:`할 일 · 오늘 ${todayN}${late?` · 지난 ${late}`:''}`})),icon),
    open.length?widgetGroups(open,t):h('div',{class:'empty'},h('b',{text:'모두 끝냈습니다'}),'아래에서 새 할 일을 추가하세요.'),
    h('form',{class:'wg-add',onsubmit:e=>{e.preventDefault();const v=inp.value.trim();if(!v)return;
      put({id:uid(),type:'todo',date:t,time:'',text:v,done:false,createdAt:Date.now()});setTimeout(()=>{const n=$('wText');if(n){n.value='';n.focus();}},0);}},
      inp,h('button',{class:'primary',type:'submit',text:'추가'})),
    h('div',{class:'wg-foot'},h('span',{text:open.length>12?`외 ${open.length-12}개`:''}),
      h('button',{class:'link',text:'캘린더 열기',onclick:()=>{location.hash='';S.view='cal';render();}})));
  p.replaceChildren(card);
  if(keep){const n=$('wText');n.value=keep.v;if(keep.f)n.focus();}
}
function fromHash(){if(location.hash==='#widget')S.view='widget';else if(S.view==='widget')S.view='cal';}
window.addEventListener('hashchange',()=>{fromHash();render();});

const ROW_H=64,BAR_TOP=36,BAR_H=12,MAX_LANES=2;
const dayDiff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
let CAL={days:[],weeks:0};
function renderCal(){
  const m=S.month,y=m.getFullYear(),mo=m.getMonth();
  $('monthLabel').textContent=`${y}년 ${mo+1}월`;
  const start=new Date(y,mo,1-m.getDay());
  const lastDay=new Date(y,mo+1,0);
  const weeks=Math.ceil((m.getDay()+lastDay.getDate())/7),n=weeks*7;
  const days=[];for(let i=0;i<n;i++){const d=new Date(start);d.setDate(start.getDate()+i);days.push(ymd(d));}
  CAL={days,weeks};
  // 하루짜리 → 점
  const marks={};
  for(const x of all()){if(x.endDate)continue;const k=x.date;(marks[k]||(marks[k]={event:0,todo:0,memo:0}));
    if(x.type==='todo'&&x.done)continue;marks[k][x.type]++;}
  const t=today(),box=$('days');box.replaceChildren();
  box.style.height=(weeks*ROW_H)+'px';
  days.forEach((k,i)=>{
    const d=pd(k),mk=marks[k];
    const cls=['day',d.getMonth()!==mo&&'out',d.getDay()===0&&'sun',d.getDay()===6&&'sat',k===t&&'today',k===S.sel&&'sel'].filter(Boolean).join(' ');
    const cnt=mk?(mk.event+mk.todo+mk.memo):0;
    box.append(h('button',{class:cls,'data-i':i,'aria-label':`${d.getMonth()+1}월 ${d.getDate()}일 ${KD[d.getDay()]}요일${cnt?`, 기록 ${cnt}개`:''}`,'aria-current':k===S.sel?'date':null,
      onclick:()=>{if(dragJustEnded){dragJustEnded=false;return;}S.sel=k;S.view='cal';if(d.getMonth()!==mo)S.month=new Date(d.getFullYear(),d.getMonth(),1);render();}},
      h('span',{class:'n',text:String(d.getDate())}),
      h('span',{class:'dots'},mk&&['event','todo','memo'].filter(tp=>mk[tp]).map(tp=>h('i',{class:'d-'+tp})))));
  });
  // 여러 날 일정 → 주 단위로 이어진 막대
  const multi=all().filter(x=>x.endDate).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0));
  const laneEnds=[];
  for(const ev of multi){
    const s=dayDiff(days[0],ev.date),e=dayDiff(days[0],ev.endDate);
    if(e<0||s>=n)continue;
    const cs=Math.max(0,s),ce=Math.min(n-1,e);
    let lane=laneEnds.findIndex(v=>v<cs);if(lane<0){lane=laneEnds.length;laneEnds.push(ce);}else laneEnds[lane]=ce;
    if(lane>=MAX_LANES)continue;
    for(let i=cs;i<=ce;){
      const row=Math.floor(i/7),rowEnd=Math.min(ce,row*7+6);
      const c0=i%7,span=rowEnd-i+1,openL=i>s,openR=rowEnd<e;
      const bar=h('button',{class:'bar'+(openL?' open-l':'')+(openR?' open-r':''),title:`${ev.text} · ${fmtDay(ev.date)}–${fmtDay(ev.endDate)}`,
        style:`left:calc(${c0}*100%/7 + ${openL?0:3}px);width:calc(${span}*100%/7 - ${(openL?0:3)+(openR?0:3)}px);top:${row*ROW_H+BAR_TOP+lane*(BAR_H+1)}px`,
        onclick:()=>openSheet(ev.id)},openL?'':ev.text);
      if(openL&&c0===0)bar.textContent=ev.text;
      box.append(bar);
      i=rowEnd+1;
    }
  }
}

/* 달력 드래그 → 기간 일정 등록 */
let drag=null,dragJustEnded=false;
function cellAt(x,y){const el=document.elementFromPoint(x,y);const c=el&&el.closest('#days .day');return c?+c.dataset.i:null;}
function paintRange(){
  const cells=[...document.querySelectorAll('#days .day')];
  cells.forEach(c=>c.classList.remove('rng','rng-l','rng-r'));
  if(!drag||drag.to==null||drag.to===drag.from)return;
  const lo=Math.min(drag.from,drag.to),hi=Math.max(drag.from,drag.to);
  for(let i=lo;i<=hi;i++){const c=cells[i];if(!c)continue;c.classList.add('rng');
    if(i===lo||i%7===0)c.classList.add('rng-l');if(i===hi||i%7===6)c.classList.add('rng-r');}
}
(function(){
  const box=$('days');
  box.addEventListener('pointerdown',e=>{if(e.button>0)return;const i=cellAt(e.clientX,e.clientY);if(i==null)return;drag={from:i,to:i,id:e.pointerId};});
  box.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const i=cellAt(e.clientX,e.clientY);
    if(i!=null&&i!==drag.to){drag.to=i;paintRange();if(navigator.vibrate)try{navigator.vibrate(5)}catch(_){}}});
  const end=e=>{if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;paintRange();
    if(e.type==='pointerup'&&d.to!=null&&d.to!==d.from){dragJustEnded=true;setTimeout(()=>dragJustEnded=false,400);
      const lo=Math.min(d.from,d.to),hi=Math.max(d.from,d.to);
      S.sel=CAL.days[lo];render();openNew({type:'event',date:CAL.days[lo],endDate:CAL.days[hi]});}};
  box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end);
})();

function itemRow(x,opts={}){
  const t=today();
  const openEdit=()=>openSheet(x.id);
  const meta=[];
  if(opts.withDate)meta.push(h('button',{class:'datechip',text:fmtDay(x.date),onclick:e=>{e.stopPropagation();goDate(x.date)}}));
  if(x.endDate)meta.push(h('span',{text:`${fmtDay(x.date)} – ${fmtDay(x.endDate)} · ${dayDiff(x.date,x.endDate)+1}일${x.time?` · ${x.time} 시작`:''}`}));
  if(x.type==='todo'&&x.time)meta.push(h('span',{class:'mono',text:x.time}));
  if(x.type==='todo'&&!x.done&&x.date<t)meta.push(h('span',{class:'late',text:`${Math.round((pd(t)-pd(x.date))/864e5)}일 지남`}));
  if(x.type==='memo'&&x.createdAt)meta.push(h('span',{text:clock(x.createdAt)+' 작성'}));
  if(x.example)meta.push(h('span',{class:'ex',text:'예시'}));
  const busy=S.asking.has(x.id);
  if(S.sample&&!x.answer&&!busy)meta.push(h('button',{class:'ask',text:'Claude에게 묻기',onclick:()=>ask(x.id)}));
  if(navigator.share)meta.push(h('button',{class:'ask',text:'Claude 앱으로',onclick:()=>navigator.share({text:x.text}).catch(()=>{})}));
  let ans=null;
  if(busy||x.answer){
    ans=h('div',{class:'ans'},
      h('div',{class:'ans-h'},'CLAUDE 답변',h('span',{class:'sp'}),
        !busy&&S.sample?h('button',{class:'ask',text:'다시 묻기',onclick:()=>ask(x.id)}):null),
      h('div',{id:'ans-'+x.id,text:busy?(S.asking.get(x.id)||'생각하는 중…'):x.answer}));
  }
  const body=h('div',{class:'body'},
    h('button',{class:'txt',style:'text-align:left',onclick:openEdit,title:'눌러서 수정',text:x.text}),
    meta.length?h('div',{class:'meta'},meta):null,ans);
  if(x.type==='todo'){
    const c=h('button',{class:'chk','aria-label':x.done?'완료 취소':'완료로 표시','aria-pressed':!!x.done,
      onclick:()=>put({...x,done:!x.done,doneAt:!x.done?Date.now():null})});
    c.innerHTML=CHECK;
    return h('li',{class:'it'+(x.done?' done':'')},c,body);
  }
  if(x.type==='event')return h('li',{class:'it'},h('span',{class:'time'+(x.time||x.endDate?'':' none'),text:x.endDate?'기간':(x.time||'종일')}),body);
  return h('li',{class:'it'},body);
}

function section(type,label,items,extra){
  return h('div',{class:'sec card'},
    h('div',{class:'sec-h'},h('i',{class:'d-'+type}),label,h('span',{class:'c',text:String(items.length)}),h('span',{class:'sp'}),extra||null),
    h('ul',{class:'list'},items));
}

function composer(){
  const inp=h('input',{type:'text',id:'cText',placeholder:PH[S.type],'aria-label':'내용',autocomplete:'off',enterkeyhint:'done'});
  const tm=h('input',{type:'time',id:'cTime','aria-label':'시간'});tm.hidden=S.type==='memo';
  const seg=h('div',{class:'seg',role:'group','aria-label':'종류'},['memo','todo','event'].map(tp=>
    h('button',{type:'button','aria-pressed':S.type===tp,onclick:()=>{S.type=tp;const v=inp.value;renderDay();const ni=$('cText');ni.value=v;ni.focus();}},h('i',{class:'d-'+tp}),TYPES[tp])));
  let askAfter=false;
  const askBtn=S.type==='memo'&&S.sample?h('button',{class:'ghost',type:'submit',text:'메모하고 묻기',onclick:()=>{askAfter=true;}}):null;
  const form=h('form',{class:'composer card',onsubmit:e=>{e.preventDefault();const v=inp.value.trim();if(!v){inp.focus();askAfter=false;return;}
    const id=uid();
    put({id,type:S.type,date:S.sel,time:S.type==='memo'?'':tm.value,text:v,done:false,createdAt:Date.now()});
    if(askAfter)ask(id);askAfter=false;
    setTimeout(()=>{const ni=$('cText');if(ni){ni.value='';ni.focus();}},0);}},
    seg,h('div',{class:'c-row'},inp,tm,askBtn,h('button',{class:'primary',type:'submit',text:'추가'})));
  return form;
}

function renderDay(){
  const prev=$('cText'),keep=prev?{v:prev.value,f:document.activeElement===prev,t:$('cTime').value}:null;
  const p=$('panel'),d=pd(S.sel),t=today(),items=ofDate(S.sel);
  const ev=items.filter(x=>x.type==='event').sort(byTime);
  const td=items.filter(x=>x.type==='todo').sort((a,b)=>(a.done-b.done)||byTime(a,b));
  const me=items.filter(x=>x.type==='memo').sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const openTd=td.filter(x=>!x.done).length;
  const rel=S.sel===t?'오늘':Math.round((d-pd(t))/864e5)===1?'내일':Math.round((d-pd(t))/864e5)===-1?'어제':null;
  const counts=[ev.length&&`일정 ${ev.length}`,td.length&&`할 일 ${td.length-openTd}/${td.length} 완료`,me.length&&`메모 ${me.length}`].filter(Boolean).join(' · ');
  const kids=[
    h('div',{class:'day-head'},
      h('div',null,h('p',{class:'eyebrow mono',text:`${d.getFullYear()} · ${KD[d.getDay()]}요일`}),
        h('h2',null,`${d.getMonth()+1}월 ${d.getDate()}일`,rel?h('span',{class:'pill',text:rel}):null)),
      h('p',{class:'counts',text:counts||'기록 없음'})),
    composer()];
  if(!items.length)kids.push(h('div',{class:'card empty'},h('b',{text:'이 날은 아직 비어 있습니다'}),'위 입력칸에서 메모·할 일·일정을 골라 추가하세요.'));
  if(ev.length)kids.push(section('event','일정',ev.map(x=>itemRow(x))));
  if(td.length)kids.push(section('todo','할 일',td.map(x=>itemRow(x))));
  if(me.length)kids.push(section('memo','메모',me.map(x=>itemRow(x))));
  p.replaceChildren(...kids);
  if(keep){const ni=$('cText');ni.value=keep.v;$('cTime').value=keep.t;if(keep.f)ni.focus();}
}

/* 할 일: 날짜별 묶음, 최신 날짜가 위 */
function renderTodos(){
  const p=$('panel'),t=today();
  const prev=$('tText'),keep=prev?{v:prev.value,f:document.activeElement===prev}:null;
  const todos=all().filter(x=>x.type==='todo');
  const open=todos.filter(x=>!x.done).length;
  const groups={};for(const x of todos)(groups[x.date]||(groups[x.date]=[])).push(x);
  const dates=Object.keys(groups).sort().reverse();
  const inp=h('input',{type:'text',id:'tText',placeholder:'오늘 할 일 추가','aria-label':'할 일 추가',autocomplete:'off',enterkeyhint:'done'});
  const kids=[
    h('div',{class:'day-head'},
      h('div',null,h('p',{class:'eyebrow',text:'날짜별'}),h('h2',null,'할 일')),
      h('p',{class:'counts',text:`남은 할 일 ${open}개`})),
    h('form',{class:'composer card',onsubmit:e=>{e.preventDefault();const v=inp.value.trim();if(!v){inp.focus();return;}
      put({id:uid(),type:'todo',date:t,time:'',text:v,done:false,createdAt:Date.now()});
      setTimeout(()=>{const n=$('tText');if(n){n.value='';n.focus();}},0);}},
      h('div',{class:'c-row'},inp,h('button',{class:'primary',type:'submit',text:'추가'})))];
  if(!dates.length)kids.push(h('div',{class:'card empty'},h('b',{text:'할 일이 없습니다'}),'위 입력칸에 적으면 오늘 날짜로 등록됩니다.'));
  for(const d of dates){
    const list=groups[d].sort((a,b)=>(a.done-b.done)||byTime(a,b));
    const diff=Math.round((pd(d)-pd(t))/864e5);
    const rel=diff===0?'오늘':diff===-1?'어제':diff===1?'내일':diff<0?`${-diff}일 전`:`${diff}일 후`;
    const openN=list.filter(x=>!x.done).length;
    kids.push(h('div',{class:'sec card'+(diff<0&&openN?' group-late':'')+(diff===0?' group-today':'')},
      h('div',{class:'sec-h'},
        h('button',{class:'datechip',text:fmtDay(d),title:'캘린더에서 보기',onclick:()=>goDate(d)}),
        h('span',{class:'rel',text:rel}),
        h('span',{class:'sp'}),
        h('span',{class:'c',text:`${list.length-openN}/${list.length} 완료`})),
      h('ul',{class:'list'},list.map(x=>itemRow(x)))));
  }
  p.replaceChildren(...kids);
  if(keep){const n=$('tText');n.value=keep.v;if(keep.f)n.focus();}
}

function goDate(k){S.sel=k;const d=pd(k);S.month=new Date(d.getFullYear(),d.getMonth(),1);S.view='cal';render();window.scrollTo({top:0});}

/* ---------- edit sheet ---------- */
let delArmed=false;
function openSheet(id){
  const x=S.items.get(id);if(!x)return;
  fillSheet({...x});
}
function openNew(draft){fillSheet({id:uid(),text:'',time:'',done:false,createdAt:Date.now(),...draft,isNew:true});}
function fillSheet(x){
  S.edit=x;delArmed=false;
  $('eText').value=x.text;$('eDate').value=x.date;$('eEnd').value=x.endDate||x.date;$('eTime').value=x.time||'';$('eDone').checked=!!x.done;
  paintSheet();$('sheetBg').hidden=false;setTimeout(()=>$('eText').focus(),0);
}
function paintSheet(){
  const e=S.edit;
  $('sheetTitle').textContent=e.isNew?TYPES[e.type]+' 등록':TYPES[e.type]+' 수정';
  $('eType').replaceChildren(...['memo','todo','event'].map(tp=>h('button',{type:'button','aria-pressed':e.type===tp,onclick:()=>{e.type=tp;paintSheet();}},h('i',{class:'d-'+tp}),TYPES[tp])));
  $('eTimeWrap').hidden=e.type==='memo';$('eDoneWrap').hidden=e.type!=='todo';$('eEndWrap').hidden=e.type!=='event';
  $('eDateLbl').textContent=e.type==='event'?'시작':'날짜';
  $('eText').placeholder=e.type==='event'?'일정 제목 (예: 부산 출장)':'내용';
  const del=$('eDel');del.hidden=!!e.isNew;del.textContent=delArmed?'한 번 더 누르면 삭제':'삭제';del.classList.toggle('armed',delArmed);
  const s=$('eDate').value,en=$('eEnd').value;
  $('eSpan').textContent=e.type==='event'&&s&&en&&en>s?`${fmtDay(s)} – ${fmtDay(en)} · ${dayDiff(s,en)+1}일`:'';
}
$('eDate').addEventListener('change',()=>{if($('eEnd').value<$('eDate').value)$('eEnd').value=$('eDate').value;paintSheet();});
$('eEnd').addEventListener('change',()=>{if($('eEnd').value<$('eDate').value)$('eEnd').value=$('eDate').value;paintSheet();});
function closeSheet(){$('sheetBg').hidden=true;S.edit=null;}
function saveEdit(askAfter){const e=S.edit;if(!e)return;const text=$('eText').value.trim();if(!text){$('eText').focus();return;}
  const done=e.type==='todo'?$('eDone').checked:false;
  const{example,isNew,...rest}=e;
  const date=$('eDate').value||e.date,en=$('eEnd').value;
  const endDate=e.type==='event'&&en&&en>date?en:'';
  put({...rest,text,date,endDate,time:e.type==='memo'?'':$('eTime').value,done,doneAt:done?(e.doneAt||Date.now()):null});
  closeSheet();if(askAfter){ask(rest.id);return;}if(isNew)toast(endDate?`${fmtDay(date)} – ${fmtDay(endDate)} 일정을 등록했습니다`:'등록했습니다');}
$('eSave').onclick=()=>saveEdit(false);
$('eAsk').onclick=()=>saveEdit(true);
$('eCancel').onclick=closeSheet;
$('eDel').onclick=()=>{if(!delArmed){delArmed=true;paintSheet();return;}const id=S.edit.id;closeSheet();remove(id);toast('삭제했습니다');};
$('sheetBg').addEventListener('click',e=>{if(e.target===$('sheetBg'))closeSheet();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheetBg').hidden)closeSheet();});

/* ---------- misc ---------- */
let tt;function toast(m){const el=$('toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2600);}
$('prev').onclick=()=>{S.month=new Date(S.month.getFullYear(),S.month.getMonth()-1,1);render();};
$('next').onclick=()=>{S.month=new Date(S.month.getFullYear(),S.month.getMonth()+1,1);render();};
$('todayBtn').onclick=()=>goDate(today());
$('tab-cal').onclick=()=>{S.view='cal';render();};
$('tab-todo').onclick=()=>{S.view='todo';render();};

$('wgBtn').onclick=()=>{location.hash='widget';};
function openSettings(msg){
  $('sKey').value=lsGet(KEY_LS);
  const sel=$('sModel');sel.replaceChildren(...MODELS.map(([v,l])=>h('option',{value:v,text:l})));sel.value=lsGet(MODEL_LS)||MODELS[0][0];
  const m=$('setMsg');m.hidden=!msg;m.textContent=msg||'';
  $('setBg').hidden=false;setTimeout(()=>$('sKey').focus(),0);
}
function closeSettings(){$('setBg').hidden=true;}
$('setBtn').onclick=()=>openSettings();
$('sCancel').onclick=closeSettings;
$('sSave').onclick=()=>{lsSet(KEY_LS,$('sKey').value.trim());lsSet(MODEL_LS,$('sModel').value);closeSettings();render();toast(lsGet(KEY_LS)?'저장했습니다. 메모에서 Claude에게 물어보세요.':'저장했습니다');};
/* ---------- Face ID 잠금 (패스키, 이 기기 안에서만) ---------- */
const LOCK_LS='ethanmemo.lock';
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0));};
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
let hiddenAt=0;
function lockOn(){return !!lsGet(LOCK_LS);}
function showLock(msg){if(!lockOn())return;$('lockMsg').textContent=msg||'잠겨 있습니다';$('lock').hidden=false;$('app').setAttribute('aria-hidden','true');}
function hideLock(){$('lock').hidden=true;$('app').removeAttribute('aria-hidden');}
async function unlock(){
  try{
    await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:unb64(lsGet(LOCK_LS))}],userVerification:'required',timeout:60000}});
    hideLock();
  }catch(e){$('lockMsg').textContent='확인하지 못했습니다. 다시 눌러 주세요.';}
}
async function enableLock(){
  if(!window.PublicKeyCredential){toast('이 브라우저는 Face ID 잠금을 지원하지 않습니다');return;}
  try{
    const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'ETHAN MEMO'},
      user:{id:rnd(16),name:'ethan-memo',displayName:'ETHAN MEMO'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000}});
    lsSet(LOCK_LS,b64(c.rawId));paintLockRow();toast('Face ID 잠금을 켰습니다');
  }catch(e){toast('Face ID 잠금을 켜지 못했습니다');}
}
function paintLockRow(){$('lockToggle').textContent=lockOn()?'끄기':'켜기';$('lockState').textContent=lockOn()?'켜짐 · 열 때와 1분 이상 나갔다 오면 확인':'앱을 열 때 Face ID로 본인 확인';}
/* ---------- 백업 (iOS 앱과 같은 형식) ---------- */
function backupJSON(){
  const items=[...S.items.values()].map(x=>({id:x.id,type:x.type,date:x.date,endDate:x.endDate||null,time:x.time||null,text:x.text,
    done:!!x.done,doneAt:x.doneAt||null,createdAt:x.createdAt||null,answer:x.answer||null,answeredAt:x.answeredAt||null}));
  return JSON.stringify({app:'ETHAN MEMO',version:1,exportedAt:Date.now(),items},null,2);
}
$('bkOut').onclick=async()=>{
  const name=`ETHAN-MEMO-백업-${ymd(new Date()).slice(2).replace(/-/g,'')}.json`;
  const file=new File([backupJSON()],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});toast('백업 파일을 저장했습니다');return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('백업 파일을 받았습니다');
};
$('bkIn').onclick=()=>$('bkFile').click();
$('bkFile').onchange=async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  try{
    const data=JSON.parse(await f.text());if(!data||!Array.isArray(data.items))throw 0;
    let add=0,upd=0;
    for(const b of data.items){if(!b||!b.id||!b.date||!b.text)continue;
      S.items.has(b.id)?upd++:add++;
      S.items.set(b.id,{id:b.id,type:['memo','todo','event'].includes(b.type)?b.type:'memo',date:b.date,endDate:b.endDate||'',time:b.time||'',text:b.text,
        done:!!b.done,doneAt:b.doneAt||null,createdAt:b.createdAt||Date.now(),answer:b.answer||undefined,answeredAt:b.answeredAt||undefined});}
    saveLocal();render();toast(`불러왔습니다 · 새 기록 ${add}개, 갱신 ${upd}개`);
  }catch(_){toast('불러오지 못했습니다. ETHAN MEMO 백업 파일인지 확인하세요.');}
};
$('lockToggle').onclick=()=>{if(lockOn()){lsSet(LOCK_LS,'');paintLockRow();toast('Face ID 잠금을 껐습니다');}else enableLock();};
$('unlockBtn').onclick=unlock;
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(lockOn()&&hiddenAt&&Date.now()-hiddenAt>60000)showLock();});
paintLockRow();showLock();
$('sClear').onclick=()=>{lsSet(KEY_LS,'');$('sKey').value='';render();toast('키를 삭제했습니다');};
$('setBg').addEventListener('click',e=>{if(e.target===$('setBg'))closeSettings();});
fromHash();
render();
connect();
})();
</script>
